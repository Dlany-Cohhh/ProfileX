<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    ProfileX 应用图标：三张倾斜叠放的配置卡片
    - 深色卡在最前（按效果图），越往后越浅：靛蓝 → 香芋紫 → 薄荷绿
    - 整体逆时针倾斜 9°，沿右上方向错开，每层带柔和投影
    - 主体约占 66%，四周留白，缩到 16px 仍能看出「三张」
  -->
  <defs>
    <filter id="pxShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#11103A" flood-opacity="0.28" />
    </filter>
  </defs>

  <g transform="translate(512 512) rotate(-9) translate(-100 100)">
    <!-- 最后一层：薄荷绿 -->
    <g transform="translate(200 -200)">
      <rect x="-210" y="-200" width="420" height="400" rx="92" fill="#74E4BC" filter="url(#pxShadow)" />
    </g>

    <!-- 中间层：香芋紫 -->
    <g transform="translate(100 -100)">
      <rect x="-210" y="-200" width="420" height="400" rx="92" fill="#9C79F8" filter="url(#pxShadow)" />
    </g>

    <!-- 最前层：靛蓝 -->
    <g>
      <rect x="-210" y="-200" width="420" height="400" rx="92" fill="#3B2FC7" filter="url(#pxShadow)" />
    </g>
  </g>
</svg>
